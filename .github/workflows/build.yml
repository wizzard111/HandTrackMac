name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements*.txt
      - run: python -m pip install uv && python -m uv pip install --system -r packaging/requirements-dev.txt pyvirtualcam --override packaging/overrides.txt
      - run: python -m pytest -q
      - name: Shell scripts are valid
        run: bash -n "Install HandTrack.command" && bash -n "Uninstall HandTrack.command" && bash -n packaging/macos/build.sh
      - name: Build the app (the same step the installer runs on the user's Mac)
        run: PYTHON=python packaging/macos/build.sh
      - name: Package the installer
        # The app is built on the user's Mac, so the release is the installer + source.
        # zip keeps the executable bit, so nobody needs chmod.
        run: |
          mkdir -p dist/HandTrack
          git archive HEAD | tar -x -C dist/HandTrack
          cd dist && zip -qry handtrack-macos.zip HandTrack
      - uses: actions/upload-artifact@v4
        with:
          name: handtrack-macos
          path: dist/handtrack-macos.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/handtrack-macos.zip
          generate_release_notes: true
